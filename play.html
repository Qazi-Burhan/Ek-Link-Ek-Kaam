<!DOCTYPE html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Follow an accessible step-by-step guide." />
    <title>Ek Link, Ek Kaam — Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="page-play">
    <div class="page-shell play-shell">
      <header class="topbar topbar-play">
        <a class="brand-wrap brand-link" href="./index.html" data-i18n-aria-label="brandName" aria-label="Ek Link, Ek Kaam">
          <span class="logo-mark" aria-hidden="true">🔗</span>
          <span>
            <span class="eyebrow" data-i18n="playGuide">گائیڈ</span>
            <span class="brand-name" id="guide-title" data-i18n="playGuide">گائیڈ</span>
          </span>
        </a>
        <div class="header-actions">
          <div class="language-switch" role="group" data-i18n-aria-label="languageControl" aria-label="Language">
            <button type="button" data-language="ur" aria-pressed="true">اردو</button>
            <button type="button" data-language="en" aria-pressed="false">English</button>
          </div>
          <button type="button" id="reset-progress" class="btn btn-ghost" data-i18n="resetProgress">سیکھنے کی پیش رفت دوبارہ ترتیب دیں</button>
          <a class="btn btn-ghost" href="./index.html" data-i18n="home">صفحۂ اول</a>
        </div>
      </header>
      <main class="player-layout">
        <section id="player-view" class="card player-card" aria-live="polite"></section>
      </main>
      <div id="player-status" class="sr-only" role="status" aria-live="polite"></div>
    </div>

    <div id="help-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-card compact-card" role="dialog" aria-modal="true" aria-labelledby="help-modal-title">
        <h2 id="help-modal-title" data-i18n="askHelpTitle">کسی سے مدد مانگیں؟</h2>
        <p id="help-message" class="muted"></p>
        <div class="modal-actions stacked">
          <button type="button" id="send-help" class="btn btn-primary" data-i18n="send">بھیجیں</button>
          <button type="button" id="cancel-help" class="btn btn-ghost" data-i18n="cancel">نہیں</button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <script type="module" src="./js/engine.js"></script>
  </body>
</html>
